<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fetch API Demo</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    button { padding: 8px 14px; cursor: pointer; }
    #output { margin-top: 10px; }
    .user { background: #f0f0f0; padding: 8px; margin: 4px 0; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Fetch API (AJAX) Demo</h1>
  <button onclick="loadUsers()">Fetch Users</button>
  <div id="output"></div>

  <script>
    async function loadUsers() {
      const output = document.getElementById("output");
      output.textContent = "Loading...";

      try {
        // Fetch data from a free public API
        const response = await fetch("https://jsonplaceholder.typicode.com/users");

        // Parse the JSON body
        const users = await response.json();

        // Build HTML from the data and inject into the page
        output.innerHTML = users.map(u =>
          `<div class="user"><b>${u.name}</b> — ${u.email}</div>`
        ).join("");

      } catch (err) {
        output.textContent = "Error: " + err.message;
      }
    }
  </script>
</body>
</html>
