<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>DOM Manipulation and Events</title>
        <style>
            body {
                font-family: Arial, sans-serif;
            }
            .highlight {
                color: white;
                background-color: yellow;
                padding: 5px;
                border-radius: 3px;
            }
            button {
                margin: 5px;
            }
        </style>
    </head>
    <body>
        <h1 id="title">DOM Manipulation and Events</h1>
        <p id="description">
            This is a demonstration of DOM manipulation using JavaScript.
        </p>
        <button id="changeTextButton" onclick="changeText()">Change Text</button>
        <button id="addItemButton">Add Item</button>
        <button id="removeItemButton">Remove Last Item</button>
        <ul id="itemList">
            <li>Item 1</li>
            <li>Item 2</li>
        </ul>
        <button id="addClassButton" >Add Highlight</button>
        <button id="removeClassButton">Remove Highlight</button>
        <button id="toggleHighlightButton">Toggle Highlight</button>
        <script>
            // DOM Elements
            const title = document.getElementById("title");
            const description = document.getElementById("description");
            const changeTextButton =
                document.getElementById("changeTextButton");
            const addItemButton = document.getElementById("addItemButton");
            const removeItemButton =
                document.getElementById("removeItemButton");
            const addClassButton = document.getElementById("addClassButton");
            const removeClassButton =
                document.getElementById("removeClassButton");
            const toggleHighlightButton = document.getElementById(
                "toggleHighlightButton"
            );
            const itemList = document.getElementById("itemList");

            // 1. Change Text Content
            changeTextButton.addEventListener("click", () => {
                title.textContent = "Title Changed!";
                description.textContent = "The text content has been updated!";
            });
            
            // 2. Add a New Item to the List
            addItemButton.addEventListener("click", () => {
                const newItem = document.createElement("li");
                newItem.textContent = `Item ${itemList.children.length + 1}`;
                itemList.appendChild(newItem);
            });

            // 3. Remove the Last Item from the List
            removeItemButton.addEventListener("click", () => {
                if (itemList.children.length > 0) {
                    itemList.removeChild(itemList.lastChild);
                } else {
                    alert("No items to remove!");
                }
            });

            // 4. Toggle Highlight Class
            toggleHighlightButton.addEventListener("click", () => {
                title.classList.toggle("highlight");
            });

            addClassButton.addEventListener("click", () => {
                if (!title.classList.contains("highlight")) {
                    title.classList.add("highlight");
                    console.log("Highlight class added.");
                } else {
                    console.log("Highlight class already exists.");
                }
            });

            // 2. Remove the Highlight Class
            removeClassButton.addEventListener("click", () => {
                if (title.classList.contains("highlight")) {
                    title.classList.remove("highlight");
                    console.log("Highlight class removed.");
                } else {
                    console.log("Highlight class does not exist.");
                }
            });

          
        </script>
    </body>
</html>
