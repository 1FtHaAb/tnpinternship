<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>LocalStorage Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    input { padding: 6px; width: 200px; }
    button { padding: 6px 12px; margin: 4px; cursor: pointer; }
    #output { margin-top: 12px; padding: 10px; background: #f4f4f4; border-radius: 4px; }
  </style>
</head>
<body>

  <h2>10) Web APIs - LocalStorage</h2>

  <input type="text" id="nameInput" placeholder="Enter your name" />
  <br /><br />
  <button id="saveBtn">Save</button>
  <button id="loadBtn">Load</button>
  <button id="clearBtn">Clear</button>

  <div id="output">No data loaded yet.</div>

  <script>
    // localStorage stores key-value pairs that persist across page refreshes.
    // Values are always strings. Use JSON.stringify/parse for objects.

    var input  = document.getElementById("nameInput");
    var output = document.getElementById("output");

    // Save to localStorage
    document.getElementById("saveBtn").addEventListener("click", function () {
      var name = input.value.trim();
      if (!name) { output.textContent = "Please enter a name."; return; }
      localStorage.setItem("internName", name);
      output.textContent = 'Saved: "' + name + '"';
    });

    // Load from localStorage
    document.getElementById("loadBtn").addEventListener("click", function () {
      var saved = localStorage.getItem("internName");
      output.textContent = saved ? 'Loaded: "' + saved + '"' : "Nothing stored.";
    });

    // Clear localStorage
    document.getElementById("clearBtn").addEventListener("click", function () {
      localStorage.removeItem("internName");
      input.value = "";
      output.textContent = "Cleared.";
    });

    // Auto-load on page load (data survives refresh!)
    (function () {
      var saved = localStorage.getItem("internName");
      if (saved) {
        output.textContent = 'Welcome back! Loaded: "' + saved + '"';
        input.value = saved;
      }
    })();
  </script>
</body>
</html>
