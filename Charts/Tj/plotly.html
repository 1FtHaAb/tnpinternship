<html>
<head>
  <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
  <div id="chart" style="width:100%;height:600px;"></div>

  <script>
    const N = 100000;
    const x = new Array(N);
    const y = new Array(N);

    for (let i = 0; i < N; i++) {
      x[i] = i;
      y[i] = Math.sin(i * 0.01) + Math.random();
    }

    const trace = {
      x: x,
      y: y,
      mode: 'lines',
      line: {
        width: 1
      }
    };

    const layout = {
      title: "100,000 Points - WebGL",
      showlegend: false
    };

    Plotly.newPlot('chart', [trace], layout, {
      responsive: true
    });
  </script>
</body>
</html>
