<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <div>
        <canvas id="myChart"></canvas>
        <canvas id="myChart1"></canvas>
        <canvas id="myChart2"></canvas>
        <canvas id="myChart3"></canvas>
        <canvas id="myChart4"></canvas>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        const ctx = document.getElementById('myChart');

        new Chart(ctx, {
            type: 'line',
            data: {
                labels: [1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979, 1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025],
                datasets: [{
                    label: '# of Votes',
                    data: [7, 14, 3, 18, 5, 11, 2, 16, 9, 4, 19, 6, 13, 8, 1, 17, 10, 15, 12, 20, 4, 9, 6, 14, 3, 18, 11, 7, 16, 2, 19, 5, 10, 13, 8, 1, 17, 12, 15, 20, 12, 23, 21, 30, 45, 50, 40, 35, 25, 30, 28, 32, 38, 42, 48],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    x: {
                        grid: {
                            color: 'rgba(200,200,200,0.5)'
                        },
                        ticks: {
                            color: 'blue',
                            font: {
                                size: 14
                            }
                        }
                    },
                    y: {
                        min: 0,
                        max: 100
                    },
                }
            }

        });
        const ctx1 = document.getElementById('myChart1');
        new Chart(ctx1, {
            type: 'radar',
            maintainAspectRatio: false,
            width: 100,
            data: {
                labels: [1972, 1973, 1974, 1975, 1976, 1977, 1978, 1979, 1980, 1981, 1982, 1983, 1984, 1985, 1986, 1987, 1988, 1989, 1990, 1991, 1992, 1993, 1994, 1995, 1996, 1997, 1998, 1999, 2000, 2001, 2002, 2003, 2004, 2005, 2006, 2007, 2008, 2009, 2010, 2011, 2012, 2013, 2014, 2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025],
                datasets: [{
                    label: '# of Votes',
                    data: [7, 14, 3, 18, 5, 11, 2, 16, 9, 4, 19, 6, 13, 8, 1, 17, 10, 15, 12, 20, 4, 9, 6, 14, 3, 18, 11, 7, 16, 2, 19, 5, 10, 13, 8, 1, 17, 12, 15, 20, 12, 23, 21, 30, 45, 50, 40, 35, 25, 30, 28, 32, 38, 42],
                    borderWidth: 1
                }]
            },
            options: {
                scales: {
                    y: {
                        beginAtZero: true
                    }
                }
            }
        });
        const ctx2 = document.getElementById('myChart2');
        new Chart(ctx2, {
            type: 'polarArea',
            data: {
                labels: ['Q1', 'Q2', 'Q3', 'Q4'],
                datasets: [
                    {
                        label: 'Revenue',
                        data: [10, 25, 15, 30],
                        borderColor: 'blue'
                    },
                    {
                        label: 'Expenses',
                        data: [8, 20, 12, 22],
                        borderColor: 'red'
                    }
                ]
            },
            options: {
                scales: {
                    y: {
                        type: 'linear',
                        position: 'left'
                    },
                    y1: {
                        type: 'linear',
                        position: 'right'
                    }
                }
            }

        });

        const ctx4 = document.getElementById('myChart3').getContext('2d');

        const gradient = ctx4.createLinearGradient(0, 0, 0, 600);
        gradient.addColorStop(0, 'rgba(125,102,182,1)');
        gradient.addColorStop(1, 'rgba(75,192,192,0.3)');

        new Chart(ctx4, {
            type: 'bar',
            data: {
                labels: [...Array(50).keys()],
                datasets: [{
                    data: Array.from({ length: 50 }, () => Math.random() * 100),
                    fill: true,
                    backgroundColor: gradient,
                    borderColor: 'teal'
                }]
            },
            options: {
                animations: {
                    y: {
                        duration: 1000
                    }
                },
                scales: {
                    y: {
                        type: 'linear',
                        position: 'left'
                    },
                    y1: {
                        type: 'linear',
                        position: 'right'
                    }
                },
                layout: {
                    padding: {
                        left: 200,
                        right: 200,
                        top: 100,
                        bottom: 100
                    }
                }
            }
        });

        const ctx6 = document.getElementById('myChart5').getContext('2d');
        new Chart(ctx6, {
            type: 'bar',
            data: {
                labels: [...Array(50).keys()],
                datasets: [{
                    data: Array.from({ length: 50 }, () => Math.random() * 100),
                    fill: true,
                    backgroundColor: gradient,
                    borderColor: 'teal'
                }]
            },
            options: {
                animations: {
                    y: {
                        duration: 1000
                    }
                },
                scales: {
                    y: {
                        type: 'linear',
                        position: 'left'
                    },
                    y1: {
                        type: 'linear',
                        position: 'right'
                    }
                },
                layout: {
                    padding: {
                        left: 200,
                        right: 200,
                        top: 100,
                        bottom: 100
                    }
                }
            }
        });

    </script>

</body>

</html>
